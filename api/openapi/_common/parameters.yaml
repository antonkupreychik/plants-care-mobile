# Общие параметры (path-id), переиспользуемые между ресурсами.
# Идентификация пользователя теперь через JWT bearer-токен (issue #88), а не
# через заголовки — отдельных параметров для неё нет.

PlantIdPath:
  name: id
  in: path
  required: true
  description: Идентификатор растения.
  schema:
    type: integer
    format: int64
    example: 1

LocationIdPath:
  name: id
  in: path
  required: true
  description: Идентификатор локации.
  schema:
    type: integer
    format: int64
    example: 1

# Backend задаёт этот параметр локально в resources/plant-templates.yaml
# (#/parameters/PlantTemplateIdPath). Бандлер мобилки (tool/bundle_openapi.dart)
# собирает parameters только из этого файла, поэтому дублируем сюда и ссылаемся
# через ../_common/parameters.yaml. Семантика идентична backend.
PlantTemplateIdPath:
  name: id
  in: path
  required: true
  description: ID шаблона растения.
  schema:
    type: integer
    format: int64
    example: 1

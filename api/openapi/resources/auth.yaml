# Мобильная аутентификация (issue #88, ADR-011).
#
# Все эндпоинты публичны (security не требуется) — это и есть точки получения
# токенов. Apple/Google принимают внешний id-token провайдера, email — magic link,
# refresh — ротацию пары. Ответ всех успешных операций (кроме email/request) —
# единая схема TokenPairResponse.

paths:
  Apple:
    post:
      tags: [Auth]
      operationId: authApple
      summary: Вход через Sign in with Apple
      description: |
        Принимает `identityToken` (JWT, выданный Apple). Сервер верифицирует
        его подпись по Apple JWKS, проверяет `iss`/`aud`/`exp`, извлекает
        стабильный `sub` (apple_subject) и email. Линковка с существующим
        пользователем — по email; если пользователя нет — создаётся новый.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/AppleAuthRequest'
      responses:
        '200':
          description: Пара токенов выдана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TokenPairResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

  Google:
    post:
      tags: [Auth]
      operationId: authGoogle
      summary: Вход через Google
      description: |
        Принимает Google `idToken`. Сервер верифицирует подпись по Google JWKS,
        проверяет `iss`/`aud`/`exp` и требует `email_verified = true`. Линковка
        по email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Пара токенов выдана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TokenPairResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

  EmailRequest:
    post:
      tags: [Auth]
      operationId: requestMagicLink
      summary: Запросить magic link на email
      description: |
        Отправляет на указанный email одноразовую ссылку для входа. Ради защиты
        от перебора (enumeration) эндпоинт **всегда** отвечает `202`, независимо
        от того, существует ли пользователь. Ограничен rate-limit'ом по IP и по
        email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/EmailRequest'
      responses:
        '202':
          description: Запрос принят. Если email валиден, письмо будет отправлено.
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '429':
          $ref: '../_common/responses.yaml#/TooManyRequests'

  EmailVerify:
    post:
      tags: [Auth]
      operationId: verifyMagicLink
      summary: Обменять magic-link токен на пару токенов
      description: |
        Принимает opaque-токен из письма. Токен одноразовый: после успешного
        обмена помечается использованным и повторно не принимается. Линковка по
        email, при необходимости создаётся новый пользователь.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Пара токенов выдана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TokenPairResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

  TelegramStart:
    post:
      tags: [Auth]
      operationId: authTelegramStart
      summary: Начать вход через Telegram-бота (issue #318)
      description: |
        Создаёт одноразовую сессию входа и возвращает `deepLink` на Telegram-бота
        вида `t.me/<botUsername>?start=auth_<sessionId>`. Пользователь открывает
        ссылку, бот присылает короткий код, который затем подтверждается через
        `POST /api/v1/auth/telegram/verify`.

        Тело запроса опционально: `deviceId` сейчас игнорируется сервером, можно
        слать пустое тело или не слать его вовсе. Эндпоинт публичный (токена ещё нет).
        Ограничен rate-limit'ом по IP.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/schemas/TelegramStartRequest'
      responses:
        '200':
          description: Сессия входа создана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TelegramStartResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '429':
          $ref: '../_common/responses.yaml#/TooManyRequests'

  TelegramVerify:
    post:
      tags: [Auth]
      operationId: authTelegramVerify
      summary: Подтвердить код входа через Telegram (issue #318)
      description: |
        Принимает `sessionId` (из ответа `telegram/start`) и `code` (присланный
        ботом). При успехе выдаёт стандартную пару токенов `TokenPairResponse` —
        ту же, что и apple/google/refresh. `telegram_chat_id` сервер берёт из
        сессии и НЕ принимает от клиента.

        Коды ошибок в `error.code`:
        - `telegram_user_not_found` (404) — к Telegram-аккаунту не привязан пользователь;
        - `invalid_code` (401) — код не совпал;
        - `session_expired` (410) — сессия истекла или не существует;
        - `too_many_attempts` (429) — превышен лимит попыток, сессия погашена.

        Эндпоинт публичный (это точка получения токенов).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/TelegramVerifyRequest'
      responses:
        '200':
          description: Пара токенов выдана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TokenPairResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          description: Код не совпал (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: '../_common/errors.yaml#/schemas/ApiErrorResponse'
              example:
                error:
                  code: invalid_code
                  message: Verification code is invalid
        '404':
          description: К Telegram-аккаунту не привязан пользователь (`telegram_user_not_found`).
          content:
            application/json:
              schema:
                $ref: '../_common/errors.yaml#/schemas/ApiErrorResponse'
              example:
                error:
                  code: telegram_user_not_found
                  message: No user is linked to this Telegram account
        '410':
          description: Сессия входа истекла или не существует (`session_expired`).
          content:
            application/json:
              schema:
                $ref: '../_common/errors.yaml#/schemas/ApiErrorResponse'
              example:
                error:
                  code: session_expired
                  message: Login session expired or not found
        '429':
          description: Превышен лимит попыток подтверждения (`too_many_attempts`).
          content:
            application/json:
              schema:
                $ref: '../_common/errors.yaml#/schemas/ApiErrorResponse'
              example:
                error:
                  code: too_many_attempts
                  message: Too many verification attempts

  Refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Ротация пары токенов по refresh-токену
      description: |
        Принимает refresh-токен, проверяет подпись/срок/тип и что его `jti` не
        отозван. Старый refresh атомарно отзывается (защита от повторного
        использования), выдаётся новая пара. Если токен уже отозван — `401`
        с кодом `TOKEN_REVOKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов выдана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TokenPairResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

  Logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выйти из текущей сессии (отозвать refresh-токен)
      description: |
        Отзывает предъявленный refresh-токен текущего пользователя. Толерантен
        и идемпотентен: повторный logout того же токена, а также невалидный/
        просроченный/чужой токен возвращают `204` без ошибки.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/LogoutRequest'
      responses:
        '204':
          description: Сессия завершена (refresh отозван либо уже был невалиден).
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

  LogoutAll:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Выйти со всех устройств (инвалидировать все refresh-токены)
      description: |
        Выставляет эпоху валидности токенов пользователя в текущий момент,
        одномоментно инвалидируя все ранее выданные refresh-токены. На следующей
        ротации старый refresh получит `401 TOKEN_REVOKED`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Все refresh-токены пользователя инвалидированы.
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

schemas:
  AppleAuthRequest:
    type: object
    description: Тело POST /api/v1/auth/apple.
    required: [identityToken]
    properties:
      identityToken:
        type: string
        minLength: 1
        description: JWT identity token, выданный Sign in with Apple.

  GoogleAuthRequest:
    type: object
    description: Тело POST /api/v1/auth/google.
    required: [idToken]
    properties:
      idToken:
        type: string
        minLength: 1
        description: Google OIDC id_token.

  EmailRequest:
    type: object
    description: Тело POST /api/v1/auth/email/request.
    required: [email]
    properties:
      email:
        type: string
        format: email
        maxLength: 320
        description: Email, на который отправить magic link.
        example: user@example.com

  MagicLinkVerifyRequest:
    type: object
    description: Тело POST /api/v1/auth/email/verify.
    required: [token]
    properties:
      token:
        type: string
        minLength: 1
        description: Opaque-токен из ссылки в письме.

  RefreshRequest:
    type: object
    description: Тело POST /api/v1/auth/refresh.
    required: [refreshToken]
    properties:
      refreshToken:
        type: string
        minLength: 1
        description: Refresh-токен, полученный при предыдущем входе/ротации.

  LogoutRequest:
    type: object
    description: Тело POST /api/v1/auth/logout.
    required: [refreshToken]
    properties:
      refreshToken:
        type: string
        minLength: 1
        description: Refresh-токен текущей сессии, который нужно отозвать.

  TelegramStartRequest:
    type: object
    description: |
      Тело POST /api/v1/auth/telegram/start. Опционально: `deviceId` сейчас
      игнорируется сервером, тело можно не отправлять.
    properties:
      deviceId:
        type: string
        nullable: true
        description: Идентификатор устройства. Пока игнорируется сервером.

  TelegramStartResponse:
    type: object
    description: Ответ POST /api/v1/auth/telegram/start (issue #318).
    required: [sessionId, deepLink, codeLength, resendAfterSec]
    properties:
      sessionId:
        type: string
        description: Идентификатор сессии входа. Передаётся обратно в telegram/verify.
      deepLink:
        type: string
        description: |
          Ссылка на Telegram-бота вида `t.me/<botUsername>?start=auth_<sessionId>`.
        example: t.me/PlantsCareBot?start=auth_8f1c2b3a
      codeLength:
        type: integer
        description: Длина кода подтверждения, который пришлёт бот.
        example: 6
      resendAfterSec:
        type: integer
        format: int64
        description: Через сколько секунд можно повторно запросить код.
        example: 60

  TelegramVerifyRequest:
    type: object
    description: |
      Тело POST /api/v1/auth/telegram/verify. `telegram_chat_id` сервер берёт из
      сессии и НЕ принимает от клиента.
    required: [sessionId, code]
    properties:
      sessionId:
        type: string
        minLength: 1
        description: Идентификатор сессии входа из ответа telegram/start.
      code:
        type: string
        minLength: 1
        description: Код подтверждения, присланный ботом.

  TokenPairResponse:
    type: object
    description: Пара токенов доступа (issue #88).
    required: [accessToken, refreshToken, expiresIn, tokenType]
    properties:
      accessToken:
        type: string
        description: Короткоживущий access-JWT для авторизации запросов к API.
      refreshToken:
        type: string
        description: Долгоживущий refresh-JWT для получения новой пары.
      expiresIn:
        type: integer
        format: int64
        description: Время жизни access-токена в секундах.
        example: 3600
      tokenType:
        type: string
        description: Тип токена для заголовка Authorization.
        example: Bearer

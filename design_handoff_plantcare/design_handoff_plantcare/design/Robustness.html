<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PlantCare — Устойчивость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    em { font-style: italic; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="robustness-demos.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [theme, setTheme] = useState('light');
      const t = window.PC_THEMES[theme];
      useEffect(() => { document.body.style.background = t.bg; }, [theme]);

      return (
        <div style={{ minHeight: '100vh', background: t.bg, color: t.ink, padding: '40px 32px 60px' }}>
          <div style={{ maxWidth: 1080, margin: '0 auto' }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 20, flexWrap: 'wrap' }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: t.primary }}>PlantCare · Устойчивость</div>
                <h1 style={{ fontFamily: '"Instrument Serif", serif', fontWeight: 400, fontSize: 46, lineHeight: 1.05, margin: '8px 0 0', letterSpacing: '-0.01em' }}>
                  Когда данные <em style={{ color: t.primary, fontStyle: 'italic' }}>не идеальны</em>
                </h1>
                <div style={{ fontSize: 15, color: t.inkSoft, marginTop: 10, maxWidth: 600, lineHeight: 1.5, textWrap: 'pretty' }}>
                  Макеты нарисованы на «красивых» данных. Здесь — как ключевые компоненты должны держаться под реальной нагрузкой: длинные имена, крупный системный шрифт, экстремальные числа, склонения. Правила — в <b style={{ color: t.ink }}>A11Y.md</b>.
                </div>
              </div>
              <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} style={{
                padding: '10px 16px', borderRadius: 999, background: t.surface, border: `1px solid ${t.line}`,
                color: t.ink, fontSize: 13, fontWeight: 600, fontFamily: 'inherit', cursor: 'pointer', flexShrink: 0,
              }}>{theme === 'light' ? '🌙 Тёмная' : '☀️ Светлая'}</button>
            </div>

            <div style={{ marginTop: 30 }}>
              <window.RobustnessDemos t={t} />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
